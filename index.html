  html, body { height: 100%; }

  body {
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Фон: логотип */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(10, 15, 30, 0.38), rgba(10, 15, 30, 0.38)), var(--logo) center / cover no-repeat;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .btn {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    min-height: 132px;
    padding: 20px 22px;
    border-radius: 20px;
    border: 1px solid var(--glass-edge);
    background: var(--glass);
    color: var(--ink);
    text-decoration: none;
    box-shadow: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }

  .btn:hover { background: var(--glass-hover); border-color: rgba(255, 255, 255, 0.6); transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .btn-title {
    font-family: var(--font-head);
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  .btn-title { display: flex; align-items: center; gap: 10px; }
  .ico { flex: none; width: 38px; height: 38px; object-fit: contain; border-radius: 9px; }

  .btn-hint {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.78);
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .arrow { flex: none; font-size: 1.2rem; color: var(--accent); }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .btn { min-height: 104px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
